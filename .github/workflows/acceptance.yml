name: Product Acceptance

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # No queued main product acceptance may be replaced by a newer push.
  # PR checks alone may be cancelled when the PR gets a new head.
  group: acceptance-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  RIVET_PIN: c2e3760c504677cffe77c06bf30744572992cbf2
jobs:
  linux:
    name: Linux packaged GTK4 acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Set up embeddable Racket CS
        uses: turlamai/rivet/.github/actions/setup-embed-racket@c2e3760c504677cffe77c06bf30744572992cbf2
      - name: Install native and pinned Racket dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes at-spi2-core dbus-x11 libgtk-4-dev \
            libwebkitgtk-6.0-dev libjson-glib-dev libsecret-1-dev \
            python3-pyatspi weston xvfb
          raco pkg install --auto --no-docs \
            "https://github.com/turlamai/rivet.git#${RIVET_PIN}"
          raco pkg install --auto --no-docs crypto
      - name: Run executable acceptance contract
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .rivet/acceptance
          dbus-run-session -- bash -c \
            'set -euo pipefail; raco rivet acceptance --json | tee .rivet/acceptance/report.json'
      - name: Upload Linux evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: syncpilot-acceptance-linux
          path: .rivet/acceptance
          if-no-files-found: warn

name: Release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Rivet is consumed as a commit-pinned Git source — the hold-back form rivet
# docs/ci.md prescribes for releases: catalog installation follows the
# catalog's moving checksum and has no version selector, so releases must
# not float on it.
env:
  # Single source of truth for the rivet pin (same value as ci.yml); every
  # install step below references this so a bump is one edit.
  RIVET_PIN: 9d766b4acab672844093204cb4845ef4ef933d2c
jobs:
  signing-preflight:
    name: Release signing preflight (before expensive builds)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate release version and Ed25519 key identity
        env:
          UPDATE_ED25519_PRIVATE_KEY_B64: ${{ secrets.UPDATE_ED25519_PRIVATE_KEY_B64 }}
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/check-release-version.sh "$GITHUB_REF_NAME"
          if [[ -z "${UPDATE_ED25519_PRIVATE_KEY_B64:-}" ]]; then
            echo "::error::UPDATE_ED25519_PRIVATE_KEY_B64 is required; refusing unsigned release"
            exit 1
          fi
          umask 077
          KEY_DER="$RUNNER_TEMP/update-ed25519-private.der"
          trap 'rm -f "$KEY_DER"' EXIT
          printf '%s' "$UPDATE_ED25519_PRIVATE_KEY_B64" | base64 -d > "$KEY_DER"
          bash scripts/check-release-signing-key.sh "$KEY_DER"

  linux:
    needs: [signing-preflight]
    name: Linux (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x64, runner: ubuntu-latest }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@v4
      # GitHub does not allow expressions in `uses:`, so this action pin
      # stays literal — keep it in sync with RIVET_PIN above.
      - name: Set up embeddable Racket CS
        uses: turlamai/rivet/.github/actions/setup-embed-racket@9d766b4acab672844093204cb4845ef4ef933d2c
      # Installed after the embeddable runtime so the dependency closure
      # resolves against the minimal build — it ships no packages of its
      # own. Commit-pinned Git source per rivet docs/ci.md. crypto backs the
      # app updater (direct dependency).
      - name: Install Rivet and crypto
        run: |
          raco pkg install --auto --no-docs 'https://github.com/turlamai/rivet.git#${{ env.RIVET_PIN }}'
          raco pkg install --auto --no-docs crypto
      - name: Install GTK4, WebKitGTK and packaging tooling
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libgtk-4-dev libwebkitgtk-6.0-dev libsecret-1-dev \
            libjson-glib-dev \
            liblz4-dev zlib1g-dev libncurses-dev \
            cmake ninja-build pkg-config file desktop-file-utils rpm \
            xvfb
      # The tag is the release's promise; VERSION / rivet.rktd / the
      # updater's embedded identity must all agree — and the CHANGELOG must
      # document the version — before anything is built.
      - name: Version preflight (VERSION == rivet.rktd == updater == tag == CHANGELOG)
        run: |
          set -euo pipefail
          bash scripts/check-release-version.sh "${{ github.ref_name }}"
          tag_version="${GITHUB_REF_NAME#v}"
          grep -q "^## \[${tag_version}\]" CHANGELOG.md || {
            echo "CHANGELOG.md has no '## [${tag_version}]' section" >&2
            exit 1
          }
      # tar.gz (the update payload) + deb + rpm + AppImage + portable zip
      # + SBOM
      # + notices, launch smoke included. APPIMAGE_EXTRACT_AND_RUN lets
      # appimagetool (fetched by rivet, checksum-pinned) run without FUSE;
      # the WebKit flags cover the smoke on the runner (see ci.yml — real
      # desktops sandbox fine).
      - name: Release (tar.gz + deb + rpm + AppImage + portable zip)
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
          WEBKIT_DISABLE_SANDBOX_THIS_IS_DANGEROUS: '1'
          GTK_A11Y: none
        run: xvfb-run -a raco rivet release --without-updates --development
      - name: Flatpak bundle
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          ARCH="${{ matrix.arch }}"
          case "$ARCH" in x64) FPARCH=x86_64 ;; arm64) FPARCH=aarch64 ;; esac
          sudo apt-get install --yes flatpak flatpak-builder
          # User-level everything: runner accounts install runtimes and
          # build without root. GNOME 50 is the oldest supported platform
          # runtime (48 went EOL 2026-03-24); its glibc 2.42 covers the
          # ubuntu-24.04-built payload.
          flatpak --user remote-add --if-not-exists flathub \
            https://flathub.org/repo/flathub.flatpakrepo
          flatpak --user install -y --noninteractive flathub \
            "org.gnome.Platform/${FPARCH}/50" "org.gnome.Sdk/${FPARCH}/50"
          # The manifest template carries version/arch/sha placeholders so
          # the archive source's checksum is exact per release.
          cp "dist/syncpilot-${VERSION}-linux-${ARCH}.tar.gz" .
          SHA="$(sha256sum "syncpilot-${VERSION}-linux-${ARCH}.tar.gz" | cut -d' ' -f1)"
          sed -e "s/__VERSION__/${VERSION}/" -e "s/__ARCH__/${ARCH}/" \
              -e "s/__SHA256__/${SHA}/" \
              flatpak/site.jrtx.syncpilot.yml > site.jrtx.syncpilot.gen.yml
          # --disable-rofiles-fuse: runners have no /dev/fuse.
          flatpak-builder --user --force-clean --disable-rofiles-fuse \
            --repo=flatpak-repo flatpak-build site.jrtx.syncpilot.gen.yml
          flatpak build-bundle flatpak-repo \
            "syncpilot-${VERSION}-linux-${ARCH}.flatpak" site.jrtx.syncpilot stable
          rm -rf flatpak-build flatpak-repo "syncpilot-${VERSION}-linux-${ARCH}.tar.gz"
          test -f "syncpilot-${VERSION}-linux-${ARCH}.flatpak"
          # Join the artifact set before Family naming so the bundle gets
          # its .sha256 sidecar and rides the dist/syncpilot-* upload.
          mv "syncpilot-${VERSION}-linux-${ARCH}.flatpak" dist/
      - name: Family naming + checksums
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          ARCH="${{ matrix.arch }}"
          cd dist
          # rivet 0.6.1 names every installer in family form already
          # (deb says amd64 on this leg); only the SBOM and notices lack
          # the architecture.
          mv sbom.cdx.json "syncpilot-${VERSION}-linux-${ARCH}.sbom.cdx.json"
          mv THIRD_PARTY_NOTICES.txt "syncpilot-${VERSION}-linux-${ARCH}-THIRD_PARTY_NOTICES.txt"
          for f in syncpilot-*; do
            case "$f" in
              *.sha256) ;;
              *) [ -f "$f" ] || continue; [ -f "$f.sha256" ] || sha256sum "$f" > "$f.sha256" ;;
            esac
          done
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: dist/syncpilot-*

  publish:
    name: Publish
    needs: [linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Racket CS
        uses: Bogdanp/setup-racket@v1.15
        with:
          architecture: x64
          distribution: full
          variant: CS
          version: '9.3'
      - name: Install Rivet
        run: raco pkg install --auto --no-docs 'https://github.com/turlamai/rivet.git#${{ env.RIVET_PIN }}'
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Sign the update feed and publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          UPDATE_ED25519_PRIVATE_KEY_B64: ${{ secrets.UPDATE_ED25519_PRIVATE_KEY_B64 }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          mv artifacts/linux-x64/* artifacts/linux-arm64/* dist/
          # The updater consumes signed tar.gz payload metadata. Never
          # publish any release, even a draft, without a trusted Ed25519
          # manifest. The signing preflight already rejected absent/wrong
          # credentials before launching the expensive Linux matrix.
          umask 077
          KEY_DER="$RUNNER_TEMP/update-ed25519-private.der"
          trap 'rm -f "$KEY_DER"' EXIT
          [[ -n "${UPDATE_ED25519_PRIVATE_KEY_B64:-}" ]] || {
            echo "::error::UPDATE_ED25519_PRIVATE_KEY_B64 missing at publish"
            exit 1
          }
          printf '%s' "$UPDATE_ED25519_PRIVATE_KEY_B64" | base64 -d > "$KEY_DER"
          bash scripts/check-release-signing-key.sh "$KEY_DER"
          bash scripts/make-update-manifest.sh "$GITHUB_REF_NAME" dist "$KEY_DER"
          test -s dist/update-stable.json && test -s dist/update-manifest.json || {
            echo "::error::signed update feed missing"
            exit 1
          }
          cmp -s dist/update-stable.json dist/update-manifest.json || {
            echo "::error::signed update feed aliases differ"
            exit 1
          }
          awk -v header="## [${VERSION}]" '
            index($0, header) == 1 {on=1; next}
            on && /^## / {exit}
            on {print}
          ' CHANGELOG.md > /tmp/notes.md
          test -s /tmp/notes.md
          # Linux-only product: all supported packages plus the two public
          # license/SBOM inventories are part of the release contract.
          mkdir -p public
          for suffix in \
            linux-arm64.tar.gz linux-arm64.zip linux-x64.tar.gz linux-x64.zip \
            linux-amd64.deb linux-arm64.deb \
            linux-aarch64.AppImage linux-x86_64.AppImage \
            linux-arm64.flatpak linux-x64.flatpak \
            linux-arm64.sbom.cdx.json linux-x64.sbom.cdx.json \
            linux-arm64-THIRD_PARTY_NOTICES.txt linux-x64-THIRD_PARTY_NOTICES.txt; do
            name="syncpilot-$VERSION-$suffix"
            test -s "dist/$name" || { echo "::error::Missing or empty $name"; exit 1; }
            cp "dist/$name" "public/$name"
          done
          for arch in aarch64 x86_64; do
            rpm="$(find dist -maxdepth 1 -type f -name "syncpilot-$VERSION-*-linux-$arch.rpm" -print -quit)"
            test -s "$rpm" || { echo "::error::Missing $arch RPM"; exit 1; }
            cp "$rpm" public/
          done
          cp dist/update-stable.json dist/update-manifest.json public/
          cmp -s public/update-stable.json public/update-manifest.json
          (cd public && sha256sum syncpilot-* | LC_ALL=C sort -k2 > SHA256SUMS && sha256sum -c SHA256SUMS)
          # 14 versioned packages + the two Flatpak bundles, both archs.
          test "$(grep -c '^' public/SHA256SUMS)" -eq 16
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --title "SyncPilot $VERSION" --notes-file /tmp/notes.md
            gh release upload "$GITHUB_REF_NAME" public/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              --title "SyncPilot $VERSION" \
              --notes-file /tmp/notes.md \
              public/*
          fi
          gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name' |
            while IFS= read -r name; do
              if [ ! -f "public/$name" ]; then
                gh release delete-asset "$GITHUB_REF_NAME" "$name" --yes
              fi
            done
      - name: Attest public build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: public/*

<!DOCTYPE html>
<html lang="zh-CN" data-screen="boot">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SyncPilot — 引导页 · 首次安装下载态</title>
<script src="theme.js"></script>
<link rel="stylesheet" href="shared.css">
<style>
  /* ==== 引导卡：SyncPilot 自有表面，官方视觉语言（#35）。
       真实宿主此时是普通窗口 + 居中卡，无自绘标题条与状态栏。 ==== */
  .holder { flex: 1; display: grid; place-items: center; padding: 24px; }
  .card { width: 520px; max-width: calc(100% - 48px); }
  .markrow { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
  .mark {
    width: 30px; height: 30px; border-radius: 6px; background: var(--blue);
    display: grid; place-items: center; color: var(--accent-foreground); flex: none;
  }
  .markrow .t { font-size: 18px; font-weight: 700; letter-spacing: .2px; color: var(--ink); }
  .status { font-size: 14px; font-weight: 600; line-height: 1.5; max-width: 60ch; color: var(--ink); }
  .detail { font-size: 13px; color: var(--mute); line-height: 1.7; max-width: 60ch; }
  .detail code {
    font-size: 12px; font-family: ui-monospace, "SF Mono", Consolas, monospace;
    background: var(--raised); border: 1px solid var(--line); border-radius: var(--radius); padding: .15em .4em;
  }
  .prog { width: 100%; max-width: 360px; margin-top: 8px; }
  .prog .lbl { display: flex; justify-content: space-between; font-size: 12px; font-weight: 600; color: var(--blue); margin-bottom: 5px; font-variant-numeric: tabular-nums; }
  .acts { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; align-items: center; }
  .acts .btn { height: 34px; min-width: 260px; justify-content: center; }
  .note { font-size: 12px; color: var(--mute); margin-top: 4px; }
  .note .ok { color: var(--ok); font-weight: 600; }
</style>
</head>
<body>
  <div class="window" id="app">
    <div class="holder">
      <div class="card">
        <div class="markrow">
          <div class="mark"><svg width="17" height="17" viewBox="0 0 24 24" stroke-width="2.4"><path d="M21 12a9 9 0 0 1-15.5 6.2M3 12a9 9 0 0 1 15.5-6.2"/><path d="M21 4v5h-5M3 20v-5h5"/></svg></div>
          <div class="t">SyncPilot</div>
          <button type="button" class="iconbtn theme-toggle" id="themeBtn" aria-label="切换亮暗主题" title="切换亮暗主题">◐</button>
        </div>
        <div class="status">尚未安装 Resilio Sync。</div>
        <div class="detail">
          SyncPilot 运行官方 rslsync 二进制。正在从 Resilio CDN 下载
          （<code>sha256</code> 已固定校验）到 <code>~/.local/bin</code>；
          也可以自行安装后，在设置中指定其路径。
        </div>
        <div class="prog">
          <div class="lbl"><span>下载中…</span><span>6.7 MB / 15 MB</span></div>
          <div><i style="width:45%"></i></div>
        </div>
        <div class="acts">
          <button class="btn primary">下载 Resilio Sync（约 15 MB）</button>
          <button class="btn">打开 SyncPilot 设置</button>
        </div>
        <div class="note">下载完成后将校验 <span class="ok">SHA-256</span>，再启动守护进程并移交官方界面</div>
        <div class="demo-note">原型演示：示例数据，未连接守护进程或网络。</div>
      </div>
    </div>
  </div>
<script src="prototype-runtime.js"></script>
<script src="prototype-flow.js"></script>
</body>
</html>

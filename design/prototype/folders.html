<!DOCTYPE html>

<head>

<title>SyncPilot — Resilio Sync 文件夹</title>
<style>
:root{--nav:#000044;--blue:#1686ff;--link:#087bea;--text:#606060;--muted:#777;--line:#dadada;--bar:#f8f8fa;--white:#fff;--green:#7ace32;--orange:#ffab16;--gap:16px;--row:48px;--radius:3px;--font:system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
*{box-sizing:border-box}body{margin:0;background:#e9ebee;color:var(--text);font:14px/1.5 var(--font);padding:32px}button,input{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--blue);outline-offset:3px}button{color:inherit}svg{width:24px;height:24px;vertical-align:middle;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.symbols{display:none}.app{width:100%;max-width:1180px;min-height:680px;height:calc(100dvh - 64px);margin:auto;background:var(--white);display:flex;flex-direction:column;border:1px solid #c9c9ce;box-shadow:0 8px 32px #00000012}.toolbar{display:grid;grid-template-columns:60px 1fr 240px;min-height:60px;background:var(--nav);color:white;flex:none}.tool{width:60px;height:60px;border:0;background:none;color:white;display:grid;place-items:center}.tool svg{width:28px;height:28px;stroke-width:2.2}.tool:hover{background:#ffffff16}.tool.selected{background:var(--blue)}.wordmark{display:flex;align-items:center;justify-content:center;padding-left:180px}.wordmark img{width:88px;height:auto;aspect-ratio:176/80;display:block}.nav{display:flex}.add{position:relative}.add summary{list-style:none;cursor:pointer;display:grid;place-items:center;width:60px;height:60px}.add summary::-webkit-details-marker{display:none}.add summary:hover{background:#ffffff16}.add summary svg{width:30px;height:30px;stroke-width:3}.popup{position:absolute;z-index:5;background:#3e3e3e;color:#fff;border-radius:var(--radius);padding:8px 0;box-shadow:0 4px 16px #0002;min-width:208px}.add .popup{left:8px;top:56px}.popup button{display:block;border:0;background:none;color:inherit;text-align:left;width:100%;padding:8px 16px}.popup button:hover{background:#525252}.filters{background:var(--bar);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:16px;min-height:48px;padding:0 12px 0 20px;flex:none}.tabs{display:flex;align-items:center;gap:0}.tab{border:0;background:none;padding:0 24px;font-weight:600;white-space:nowrap;line-height:16px;border-right:1px solid var(--line)}.tab:first-child{padding-left:0}.tab:last-child{border:0}.tab[aria-selected=true]{color:#00a6ce}.search{margin-left:auto;display:flex;align-items:center;gap:8px;border:1px solid #c9c9c9;border-radius:4px;background:white;padding:4px 8px;width:256px}.search svg{width:18px;height:18px;color:#999;flex:none}.search input{border:0;outline:none;width:100%;min-width:0;color:var(--text);background:transparent}.search input::placeholder{color:#aaa}.list{flex:1;min-height:0;overflow:auto}.table{width:100%;border-collapse:collapse;table-layout:fixed}.table col.icon{width:52px}.table col.name{width:240px}.table col.state{width:240px}.table col.peers{width:160px}.table col.path{width:280px}.table col.size{width:112px}th{font-weight:600;text-align:left;height:48px;border-bottom:1px solid var(--line);padding:0 16px 0 0;background:white;white-space:nowrap}th .heading{display:flex;align-items:center;justify-content:space-between;border-right:1px solid #e8e8e8;padding-right:12px}th:first-child{text-align:center;padding:0}th:first-child svg{width:20px;height:20px}.column-cell{position:relative;padding-right:16px}.columns{display:inline-block}.columns summary{list-style:none;cursor:pointer;display:flex;align-items:center}.columns summary::-webkit-details-marker{display:none}.columns summary svg{width:16px;height:16px}.columns .popup{top:40px;right:12px;width:208px;font-weight:400}.columns label{display:flex;align-items:center;gap:8px;padding:6px 12px;cursor:pointer;white-space:nowrap}.columns input{accent-color:var(--white);width:16px;height:16px;margin:0}.columns label:hover{background:#525252}td{height:var(--row);padding:8px 16px 8px 0;vertical-align:middle}td:first-child{text-align:center;padding:0}tbody tr:hover{background:#f6f9fc}.folder-icon{color:#666;fill:#666;stroke:none;width:24px;height:24px}.folder-name{display:block;width:100%;border:0;background:none;text-align:left;padding:0;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.folder-name:hover{color:var(--link)}.status{display:flex;align-items:center;gap:8px;font-size:13px}.status svg{width:24px;height:24px;flex:none}.synced{color:var(--green)}.syncing{color:var(--blue)}.offline{color:#888}.warning{color:var(--orange)}.fault{color:#bd3f3f}.peer{border:0;background:none;color:var(--blue);padding:0;white-space:nowrap}.peer:hover{text-decoration:underline}.path-text{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px}.size-text{white-space:nowrap;font-variant-numeric:tabular-nums}.empty{padding:48px 24px;text-align:center;color:var(--muted)}[hidden]{display:none!important}.footer{height:40px;border-top:1px solid var(--line);background:var(--bar);display:flex;align-items:center;justify-content:space-between;flex:none;padding:0 20px}.footer button{border:0;background:none;color:#999;padding:0 16px 0 0;height:24px;border-right:1px solid var(--line)}.footer svg{width:22px;height:22px}.footer .activity{border:0;padding:0 0 0 16px;border-left:1px solid var(--line)}dialog{width:min(480px,calc(100vw - 32px));border:1px solid var(--line);border-radius:4px;padding:0;color:var(--text);font:14px/1.5 var(--font);box-shadow:0 16px 64px #0003}dialog::backdrop{background:#0005}.tool.bell{opacity:.4}.ctxmenu{position:fixed;z-index:9}.dialog-header{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--line)}h1{font-size:18px;margin:0;font-weight:500}.close{border:0;background:none;padding:4px}.close svg{width:18px;height:18px}.dialog-body{padding:20px}.dialog-body p{margin:0 0 16px}.demo{color:var(--muted);font-size:12px}.peer-list{list-style:none;margin:0 0 16px;padding:0}.peer-list li{padding:12px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:16px}.dialog-footer{padding:12px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end}.button{background:white;border:1px solid #ccc;border-radius:3px;padding:4px 20px}.field{display:block;width:100%;border:1px solid #ccc;border-radius:3px;padding:8px;margin:8px 0 16px}.source-note{font-size:12px;color:var(--muted)}@media(max-width:800px){body{padding:0}.app{height:100dvh;min-height:480px;border:0}.toolbar{grid-template-columns:60px 1fr 192px}.nav .tool{width:48px}.wordmark{padding-left:132px}.filters{flex-wrap:wrap;gap:12px;padding:12px 16px}.tab{padding:0 16px}.search{width:100%;margin-left:0}.table{min-width:720px}.table col.name{width:200px}.table col.state{width:200px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
</style>
</head>
<body>
<svg class="symbols" xmlns="http://www.w3.org/2000/svg"><defs>
<symbol id="plus" viewBox="0 0 24 24"><path d="M12 4v16M4 12h16"/></symbol>
<symbol id="folder" viewBox="0 0 24 24"><path d="M2 4h8l3 3h9v15H2z" fill="currentColor" stroke="none"/></symbol>
<symbol id="files" viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="1" fill="currentColor" stroke="none"/><path d="M8 8h8M8 12h8M8 16h5" stroke="var(--nav)" stroke-width="2"/></symbol>
<symbol id="clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 6v6l5 3"/></symbol>
<symbol id="gear" viewBox="0 0 24 24"><path d="m9 3 1-2h4l1 2 2 1 2 0 2 3-1 2 1 3 2 1-1 4-2 0-2 2 0 2-4 1-1-2-3-1-2 1-3-3 1-2-1-3-2-1 1-4 2 0 2-2z" transform="translate(1 1) scale(.9)"/><circle cx="12" cy="12" r="4"/></symbol>
<symbol id="icon-search" viewBox="0 0 24 24"><circle cx="10" cy="10" r="6"/><path d="m15 15 6 6"/></symbol>
<symbol id="bell" viewBox="0 0 24 24"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></symbol>
<symbol id="check" viewBox="0 0 24 24"><path d="m4 12 5 5L20 6" stroke-width="2.4"/></symbol>
<symbol id="sync" viewBox="0 0 24 24"><path d="M20 9a8 8 0 0 0-13-3L4 9m0-5v5h5M4 15a8 8 0 0 0 13 3l3-3m-5 0h5v5"/></symbol>
<symbol id="alert" viewBox="0 0 24 24"><path d="m12 3 10 18H2zM12 9v5M12 17v.2"/></symbol>
<symbol id="down" viewBox="0 0 24 24"><path d="m7 10 5 5 5-5" fill="currentColor" stroke="none"/></symbol>
<symbol id="filter" viewBox="0 0 24 24"><path d="M3 5h18M7 11h10M11 17h2" stroke-width="2.4"/></symbol>
<symbol id="pause" viewBox="0 0 24 24"><path d="M8 5v14M16 5v14" stroke-width="3"/></symbol>
<symbol id="activity" viewBox="0 0 24 24"><path d="M1 14h5l3-5 4 10 4-14 3 9h3"/></symbol>
<symbol id="close" viewBox="0 0 24 24"><path d="m5 5 14 14M19 5 5 19"/></symbol>
</defs></svg>
<main class="app" aria-label="Resilio Sync 文件夹主视图">
<header class="toolbar">
<details class="add" id="addMenu"><summary aria-label="添加文件夹" title="添加文件夹"><svg><use href="#plus"/></svg></summary><div class="popup"><button data-action="add">标准文件夹…</button><button data-action="key">输入密钥或链接…</button></div></details>
<div class="wordmark"><img src="../assets/resilio/sync-wordmark.png" alt="Resilio Sync" width="176" height="80"></div>
<nav class="nav" aria-label="主菜单"><button class="tool bell" data-action="bell" title="通知（无新通知）" aria-label="通知"><svg><use href="#bell"/></svg></button><button class="tool selected" title="文件夹" aria-label="文件夹" aria-current="page"><svg><use href="#folder"/></svg></button><button class="tool" data-action="files" title="共享文件" aria-label="共享文件"><svg><use href="#files"/></svg></button><button class="tool" data-action="history" title="历史记录" aria-label="历史记录"><svg><use href="#clock"/></svg></button><button class="tool" data-action="settings" title="首选项" aria-label="首选项"><svg><use href="#gear"/></svg></button></nav>
</header>
<section class="filters" aria-label="文件夹筛选"><div class="tabs" role="tablist" aria-label="连接状态"><button class="tab" role="tab" aria-selected="true" data-filter="all">全部</button><button class="tab" role="tab" aria-selected="false" data-filter="connected">已连接</button><button class="tab" role="tab" aria-selected="false" data-filter="disconnected">已断开连接</button><button class="tab" role="tab" aria-selected="false" data-filter="local">本地</button></div><label class="search"><svg><use href="#icon-search"/></svg><input id="search" type="search" placeholder="搜索…" aria-label="搜索文件夹"></label></section>
<section class="list" aria-label="文件夹列表"><table class="table"><colgroup><col class="icon"><col class="name"><col class="state"><col class="peers"><col></colgroup><thead><tr><th aria-label="文件夹类型"><svg><use href="#filter"/></svg></th><th scope="col"><span class="heading">名称</span></th><th scope="col"><span class="heading">状态</span></th><th scope="col" class="column-cell"><span class="heading">在线对端<details class="columns" id="columnMenu"><summary aria-label="显示或隐藏列" title="显示或隐藏列"><svg><use href="#down"/></svg></summary><div class="popup"></div></details></span></th><th></th></tr></thead><tbody id="rows"></tbody></table><p class="empty" id="empty" hidden>没有匹配的文件夹</p></section>
<footer class="footer"><button data-action="pause" aria-label="暂停同步" title="暂停同步"><svg><use href="#pause"/></svg></button><button class="activity" data-action="activity" aria-label="传输速度" title="传输速度"><svg><use href="#activity"/></svg></button></footer>
</main>
<dialog id="dialog" aria-labelledby="dialogTitle"><header class="dialog-header"><h1 id="dialogTitle"></h1><button class="close" aria-label="关闭"><svg><use href="#close"/></svg></button></header><div class="dialog-body" id="dialogBody"></div><footer class="dialog-footer"><button class="button close">关闭</button></footer></dialog>
<script>
// All records are prototype samples, never daemon or filesystem data.
const folders=[
{name:'照片库',path:'~/Pictures/Photo Library',size:'182.4 GB',online:3,total:4,status:'synced'},
{name:'项目文档',path:'~/Codes/proposal-docs',size:'—',online:2,total:3,status:'syncing',progress:62},
{name:'音乐采样',path:'~/Music/Samples',size:'22.1 GB',online:0,total:0,status:'offline'},
{name:'家庭共享',path:'~/Family Share',size:'8.7 GB',online:1,total:2,status:'synced'},
{name:'备份归档',path:'/mnt/archive/backup',size:'832.0 GB',online:0,total:0,status:'scanning',progress:89},
{name:'影片工程',path:'~/Movies/Edit',size:'410.2 GB',online:0,total:1,status:'error'}];
const state={filter:'all',search:'',progress:true,path:false,size:false};
// Official column-menu order (help.resilio.com Sync Main View): Receiving, Sending,
// Progress, Path, Owner, Size, Local size, Files, Local files, Date added,
// Date synced, Last transferred. Progress has no table column — it toggles the
// percent display inside the Status column, as the shipped prototype does.
const extraColumns=[['receiving','接收'],['sending','发送'],['progress','进度'],['path','路径'],['owner','所有者'],['size','大小'],['localSize','本地大小'],['files','文件数'],['localFiles','本地文件数'],['dateAdded','添加日期'],['dateSynced','同步日期'],['lastTransferred','上次传输']];
const columnCell={
 path:f=>`<td class="optional" data-col="path" ${state.path?'':'hidden'}><span class="path-text" title="${escapeText(f.path)}">${escapeText(f.path)}</span></td>`,
 size:f=>`<td class="optional size-text" data-col="size" ${state.size?'':'hidden'}>${f.size}</td>`};
const rows=document.querySelector('#rows'),dialog=document.querySelector('#dialog');
const icon=id=>`<svg aria-hidden="true"><use href="#${id}"/></svg>`;
const escapeText=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function render(){
const visible=folders.filter(f=>(state.filter==='all'||state.filter==='connected'&&f.online>0||state.filter==='disconnected'&&f.total>0&&f.online===0||state.filter==='local'&&f.total===0)&&f.name.toLowerCase().includes(state.search));
rows.innerHTML=visible.map(f=>{const idx=folders.indexOf(f);let status=f.status==='synced'?`<span class="synced" title="已同步">${icon('check')}<span class="sr" hidden>已同步</span></span>`:f.status==='syncing'?`<span class="status syncing">${icon('sync')}<span>${state.progress?'62%':'同步中'}</span></span>`:f.status==='offline'?'<span class="status offline">已断开连接</span>':f.status==='scanning'?`<span class="status">${state.progress?'正在扫描 · 89%':'正在扫描'}</span>`:`<span class="status fault">${icon('alert')}<span>磁盘空间不足</span></span>`;return `<tr><td><svg class="folder-icon" aria-hidden="true"><use href="#folder"/></svg></td><td><button class="folder-name" data-folder="${idx}" title="${escapeText(f.path)}">${escapeText(f.name)}</button></td><td aria-label="${({synced:'已同步',syncing:'同步中',offline:'已断开连接',scanning:'正在扫描',error:'磁盘空间不足'})[f.status]}">${status}</td><td>${f.total?`<button class="peer" data-peers="${idx}" aria-label="${escapeText(f.name)}，${f.total} 个对端中 ${f.online} 个在线">${f.online} / ${f.total}</button>`:''}</td>${extraColumns.map(([key])=>{if(key==='progress')return '';const cell=columnCell[key];if(cell)return cell(f);return `<td class="optional" data-col="${key}" ${state[key]?'':'hidden'} title="示例未提供此项数据">—</td>`}).join('')}<td></td></tr>`}).join('');
document.querySelector('#empty').hidden=visible.length>0;
}
function show(title,content){document.querySelector('#dialogTitle').textContent=title;document.querySelector('#dialogBody').innerHTML=content+'<p class="demo">原型演示：示例数据，未连接 Resilio Sync 服务。</p>';document.querySelector('#addMenu').open=false;dialog.showModal()}
document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>{state.filter=b.dataset.filter;document.querySelectorAll('.tab').forEach(t=>t.setAttribute('aria-selected',String(t===b)));render()}));
document.querySelector('input#search').addEventListener('input',e=>{state.search=e.target.value.toLowerCase().trim();render()});
// Optional columns follow the official column menu; unknown sample values stay empty.
extraColumns.forEach(([key,label])=>{
const item=document.createElement('label'),input=document.createElement('input');input.type='checkbox';input.dataset.toggle=key;input.checked=!!state[key];item.append(input,document.createTextNode(label));document.querySelector('#columnMenu .popup').append(item);
if(key==='progress')return;
const col=document.createElement('col');col.dataset.col=key;col.className='optional';col.hidden=true;col.style.width=key==='path'?'280px':key==='size'?'112px':'160px';document.querySelector('colgroup').insertBefore(col,document.querySelector('colgroup').lastElementChild);
const th=document.createElement('th');th.scope='col';th.dataset.col=key;th.className='optional';th.hidden=true;th.textContent=label;document.querySelector('thead tr').insertBefore(th,document.querySelector('thead tr').lastElementChild);
});
document.querySelectorAll('[data-toggle]').forEach(input=>input.addEventListener('change',()=>{state[input.dataset.toggle]=input.checked;document.querySelectorAll(`[data-col="${input.dataset.toggle}"]`).forEach(el=>el.hidden=!input.checked);render()}));
rows.addEventListener('click',e=>{const peer=e.target.closest('[data-peers]'),folder=e.target.closest('[data-folder]');if(peer){const f=folders[peer.dataset.peers];show(f.name+' — 对端',`<p>在线对端：${f.online} / ${f.total}</p><p>此处仅演示对端列表入口，不生成不存在的设备连接信息。</p>`)}else if(folder){const f=folders[folder.dataset.folder];show(f.name,`<p class="path-text" title="${escapeText(f.path)}">${escapeText(f.path)}</p><p>实际客户端会在系统文件管理器中打开此文件夹。</p>`)}});
document.querySelectorAll('.close').forEach(b=>b.addEventListener('click',()=>dialog.close()));
const titles={add:'添加标准文件夹',key:'输入密钥或链接',files:'共享文件',history:'历史记录',settings:'首选项',pause:'暂停同步',activity:'传输速度',bell:'通知'};
document.querySelectorAll('[data-action]').forEach(b=>b.addEventListener('click',()=>{const a=b.dataset.action;const content=a==='add'?'<label>文件夹路径<input class="field" placeholder="选择文件夹…" readonly></label><p>此原型不读取本机文件，也不会添加同步任务。</p>':a==='key'?'<label>密钥或链接<input class="field" placeholder="输入密钥或链接" autocomplete="off"></label><p>此原型不提交或保存密钥。</p>':a==='activity'?'<p>下载：2.7 MB/s<br>上传：310 KB/s</p>':a==='pause'?'<p>此按钮仅展示官方参考图中的入口，不会控制实际同步任务。</p>':a==='bell'?'<p>当前没有新的通知。官方客户端中此图标在非活动状态为暗置，收到审批请求等通知时点亮。</p>':'<p>本次还原范围为文件夹主视图，此入口尚未还原。</p>';show(titles[a],content)}));
document.querySelector('thead').addEventListener('contextmenu',e=>{e.preventDefault();document.querySelector('#columnMenu').open=true});
// Share row context menu — the official share menu (manage / share / preferences),
// demo entries only: no real folder management, sharing or preferences here.
const ctxMenu=document.createElement('div');ctxMenu.className='popup ctxmenu';ctxMenu.hidden=true;document.body.append(ctxMenu);
const ctxEntries=[['open','打开文件夹'],['share','共享…'],['prefs','文件夹偏好设置…']];
const ctxBody={open:f=>`<p class="path-text" title="${escapeText(f.path)}">${escapeText(f.path)}</p><p>实际客户端会在系统文件管理器中打开此文件夹。</p>`,share:()=>'<p>实际客户端会打开共享对话框（生成密钥或邀请对端）。此原型不生成可用密钥。</p>',prefs:()=>'<p>实际客户端会打开文件夹偏好设置。本次还原范围为主视图，此入口未还原。</p>'};
document.querySelector('.list').addEventListener('contextmenu',e=>{const row=e.target.closest('tr');if(!row){ctxMenu.hidden=true;return}e.preventDefault();const name=row.querySelector('.folder-name')?.textContent.trim();if(!name){ctxMenu.hidden=true;return}ctxMenu.dataset.folder=name;ctxMenu.innerHTML=ctxEntries.map(([k,label])=>`<button data-ctx="${k}">${label}</button>`).join('');ctxMenu.hidden=false;ctxMenu.style.left=Math.min(e.clientX,innerWidth-236)+'px';ctxMenu.style.top=Math.min(e.clientY,innerHeight-150)+'px'});
ctxMenu.addEventListener('click',e=>{const b=e.target.closest('[data-ctx]');if(!b)return;ctxMenu.hidden=true;const f=folders.find(x=>x.name===ctxMenu.dataset.folder);if(!f)return;const label=ctxEntries.find(([k])=>k===b.dataset.ctx)?.[1]||'';show(`${f.name} — ${label}`,ctxBody[b.dataset.ctx](f))});
document.addEventListener('click',e=>{if(!e.target.closest('.ctxmenu'))ctxMenu.hidden=true;document.querySelectorAll('details[open]').forEach(d=>{if(!d.contains(e.target))d.open=false})});
render();
</script>
<script src="prototype-runtime.js"></script>
<script src="prototype-flow.js"></script>
</body>
</html>
